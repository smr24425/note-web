    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="備忘錄" />

    <!-- Icons -->
    <link rel="icon" href="/note-web/favicon.ico" sizes="any" />

    <!-- GitHub Pages SPA redirect restore -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>
    <script type="module" crossorigin src="/note-web/assets/index-CM9g8JUc.js"></script>
    <link rel="stylesheet" crossorigin href="/note-web/assets/index-Bf952wsN.css">
  <link rel="manifest" href="/note-web/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/note-web/registerSW.js"></script></head>
  <body>
    <!-- Liquid glass SVG displacement filter — referenced via backdrop-filter: url(#liquid_glass_filter) -->
    <svg width="0" height="0" style="position:fixed;left:-9999px;top:-9999px" aria-hidden="true">
      <defs>
        <filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.003" numOctaves="2" seed="7" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="1.2" result="map"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="110" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
  </body>
</html>
